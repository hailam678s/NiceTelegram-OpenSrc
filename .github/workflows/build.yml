name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        run: |
          set -euo pipefail
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools-out
          rm -rf "$SDK/cmdline-tools/latest"
          mv /tmp/cmdtools-out/cmdline-tools "$SDK/cmdline-tools/latest"

          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          chmod +x "$SDK/cmdline-tools/latest/bin/"*

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          yes | "$SM" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SM" --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          echo "sdk.dir=$SDK" > local.properties
          echo "SDK ready at $SDK"

      - name: Prefetch jsr305
        run: |
          mkdir -p "$HOME/.m2/repository/com/google/code/findbugs/jsr305/3.0.2"
          curl -fsSL -o "$HOME/.m2/repository/com/google/code/findbugs/jsr305/3.0.2/jsr305-3.0.2.pom" \
            "https://repo1.maven.org/maven2/com/google/code/findbugs/jsr305/3.0.2/jsr305-3.0.2.pom" || true
          curl -fsSL -o "$HOME/.m2/repository/com/google/code/findbugs/jsr305/3.0.2/jsr305-3.0.2.jar" \
            "https://repo1.maven.org/maven2/com/google/code/findbugs/jsr305/3.0.2/jsr305-3.0.2.jar" || true
          ls -la "$HOME/.m2/repository/com/google/code/findbugs/jsr305/3.0.2/" || true

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug --refresh-dependencies

      - uses: actions/upload-artifact@v4
        with:
          name: SystemUpdate-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
